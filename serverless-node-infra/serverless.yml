service: serveless-node-infra
frameworkVersion: '3'

useDotenv: true

plugins:
  - serverless-esbuild
  - serverless-dynamodb
  - serverless-offline
  - serverless-iam-roles-per-function

custom:
  esbuild:
    target: node20
    bundle: true
    minify: true
    sourcemap: false
    exclude:
      - '@aws-sdk/*'
    # define:
    #   require.resolve: undefined
    platform: node
    # concurrency: 10
  serverless-dynamodb:
    stages:
      - dev
    start:
      docker: true
      port: 8000
      shareDB: true
      migrate: true
      convertEmptyValues: true
      noStart: true
  environment:
    # COGNITO_CLIENT_ID: !Ref UserPoolClient
    # COGNITO_POOL_ID: !Ref UserPool
    ORDER_QUEUE_URL: !GetAtt OrderSQS.QueueUrl
    PRODUCTS_TABLE: !Ref ProductsTable
    UPLOAD_FILE_TABLE: !Ref UploadedFilesTable
    FILE_UPLOAD_BUCKET: !Ref FileUploaderBucket

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  # profile: app
  timeout: 10 # optional, in seconds, default is 6
  region: us-east-1
  httpApi:
    cors: true
    # authorizers:
    #   CognitoAuthorizer:
    #     type: jwt
    #     identitySource: $request.header.Authorization
    #     issuerUrl: !GetAtt UserPool.ProviderURL
    #     audience:
    #       - !Ref UserPoolClient

  environment:
    DEBUG: ${env:DEBUG, false}
    STAGE: ${self:provider.stage}
    # COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, self:custom.environment.COGNITO_CLIENT_ID}
    # COGNITO_POOL_ID: ${env:COGNITO_POOL_ID, self:custom.environment.COGNITO_POOL_ID}
    ORDER_QUEUE_URL: ${env:ORDER_QUEUE_URL, self:custom.environment.ORDER_QUEUE_URL}
    PRODUCTS_TABLE: ${env:PRODUCTS_TABLE, self:custom.environment.PRODUCTS_TABLE}
    UPLOAD_FILE_TABLE: ${env:UPLOAD_FILE_TABLE, self:custom.environment.UPLOAD_FILE_TABLE}
    FILE_UPLOAD_BUCKET: ${env:FILE_UPLOAD_BUCKET, self:custom.environment.FILE_UPLOAD_BUCKET}

package:
  individually: true

functions:
  - ${file(src/resources/dynamoDB/serverless.yml):functions}
  # - ${file(src/resources/cognito/serverless.yml):functions}
  - ${file(src/resources/s3/serverless.yml):functions}
  - ${file(src/resources/sqs/serverless.yml):functions}

resources:
  - Resources:
      CloudWatchPolicy:
        Type: AWS::IAM::Policy
        Properties:
          PolicyName: LambdaCloudWatchPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:TagResource
                Resource:
                  - 'Fn::Join':
                      - ':'
                      - - 'arn:aws:logs'
                        - Ref: 'AWS::Region'
                        - Ref: 'AWS::AccountId'
                        - 'log-group:/aws/lambda/*:*:*'
          Roles:
            - Ref: DynamoDBRole
            # - Ref: CognitoRole
  - ${file(src/resources/dynamoDB/serverless.yml):resources}
  # - ${file(src/resources/cognito/serverless.yml):resources}
  - ${file(src/resources/s3/serverless.yml):resources}
  - ${file(src/resources/sqs/serverless.yml):resources}
